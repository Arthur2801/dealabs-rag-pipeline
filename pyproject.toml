[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dealabs-rag-pipeline"
version = "0.1.0"
description = "Extraction, indexation vectorielle et recherche de bons plans Dealabs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.20",
    "requests-oauthlib>=1.2",
    "click>=7",
]

[project.optional-dependencies]
pipeline = [
    "pymongo[srv]>=4.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
]
app = [
    "streamlit>=1.30",
    "pymongo[srv]>=4.6",
    "python-dotenv>=1.0",
    "langchain-core>=0.1",
    "langchain-groq>=0.0.1",
    "sentence-transformers>=2.2",
]

[project.scripts]
dealabs = "dealabs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dealabs", "dealabs_pipeline"]

[tool.black]
line-length = 88
target-version = ["py311"]
